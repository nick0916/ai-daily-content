# Curated columns (專欄). Ids kept from the original setup; prompts rewritten.
# selection_mode: curated → Sonnet picks from a 30-day quality-gated pool.
# selection_mode: chronological → latest items from filter.sources, no LLM.
columns:
  - id: ai-techniques
    display_name: "🎓 AI 使用技巧"
    prompt: >-
      實際可操作的 AI 使用技巧：prompt 寫法、Claude Code / Codex 等 coding agent 的工作流、
      skills / hooks / MCP 的用法、提升產出品質的具體方法。必須有讀者看完就能照做的步驟或範例；
      純產品宣告、新聞、融資消息不要收。
    min_items: 3
    filter:
      keywords: ["prompt", "workflow", "Claude Code", "Codex", "MCP", "skill", "hook", "agent"]
      exclude: [" with OpenAI", " with ChatGPT Work", " with GPT-"]   # vendor customer stories

  - id: ai-flow-adoption
    display_name: "🛤️ 導入心得"
    prompt: >-
      個人或團隊把 AI 導入日常工作流程的第一手經驗與 lessons learned：做了什麼、遇到什麼問題、
      怎麼解決、成效如何。必須有 first-person 經驗；純 announcement、沒有實際經驗的觀點文不要收。
    min_items: 3
    filter:
      keywords: ["lessons", "experience", "in production", "we built", "心得", "經驗"]
      exclude: [" with OpenAI", " with ChatGPT Work", " with GPT-"]   # vendor customer stories

  - id: enterprise-ai-adoption
    display_name: "🏢 企業導入"
    prompt: >-
      企業 / 組織層級的 AI 導入：組織調整、流程改造、治理、ROI 與成效衡量、大規模部署的案例。
      只是「某公司 + AI」的新聞稿、沒談導入流程 / 組織 / 成效的不要收。
    min_items: 3
    filter:
      keywords: ["enterprise", "organization", "adoption", "ROI", "governance", "企業"]

  - id: ai-knowledge-mgmt
    display_name: "🧠 知識管理"
    prompt: >-
      用 AI 做知識管理與檢索：RAG、memory、embedding、個人知識庫（Obsidian 等）、
      文件整理與搜尋的架構與實作。泛泛談「AI 很重要」的文章不要收。
    min_items: 3
    filter:
      keywords: ["RAG", "retrieval", "memory", "knowledge", "embedding", "Obsidian", "知識"]
      exclude: [" with OpenAI", " with ChatGPT Work", " with GPT-"]   # vendor customer stories

  - id: ai-security
    display_name: "🔐 AI 安全"
    prompt: >-
      AI 系統的安全議題：prompt injection、jailbreak、agent 權限與 sandbox、供應鏈與模型風險、
      資料外洩與防禦做法。只是順帶提到 "security" 的一般產品更新不要收。
    min_items: 3
    filter:
      keywords: ["security", "prompt injection", "jailbreak", "vulnerability", "sandbox", "安全"]
      exclude: [" with OpenAI", " with ChatGPT Work", " with GPT-"]   # vendor customer stories

  - id: ai-learning
    display_name: "📚 用 AI 學習・降低認知負荷"
    prompt: >-
      用 AI 幫助「人」學習或降低認知負荷的具體方法、工具與研究，聚焦三類：
      (1) 用 AI 學習：自學新技能／語言／學科、讀懂論文或長文件、備考、用 AI 當家教或陪孩子學習、
      教師用 AI 讓學生學得更好，要有具體做法（prompt、流程、工具設定）或可照做的步驟；
      (2) 用 AI 降低認知負荷：處理資訊過載、整理思緒與待辦、把工作記憶外部化、減少情境切換、
      輔助決策，要有具體工具用法或工作方法；
      (3) 研究與反思：AI 對學習成效、批判思考、記憶的影響（cognitive offloading、cognitive debt），
      以及避免「AI 代勞反而沒學到」的做法（例如先自己想再問、蘇格拉底式提問、學習模式）。
      必須有具體方法、工具用法或研究結果。
      不要收：模型訓練、machine learning 技術、agent 自我學習等「機器學習」內容；
      AI 廠商教育產品的新功能宣告或宣傳文（沒有實際用法）；學區採購、教育政策新聞；
      課程招生與付費社群推銷；和 AI 無關的一般學習法；企業 L&D 採購或課程製作的商業分析。
    min_items: 1   # sources are sparse — show even a single good fit
    filter:
      keywords: ["learn faster", "learning with AI", "studying", "study mode", "learning mode", "students", "tutor", "cognitive", "spaced repetition", "flashcard", "NotebookLM", "Socratic", "critical thinking", "information overload", "overwhelm", "學習", "認知", "自學"]
      exclude: [" with OpenAI", " with ChatGPT Work", " with GPT-"]   # vendor customer stories

  - id: ai-daily-life
    display_name: "🏡 AI 幫助日常生活"
    prompt: >-
      個人在「工作以外」用 AI 的具體實例：生活安排與家務、
      健康／運動／飲食的記錄與規劃、旅遊規劃、購物比價、家庭與育兒、個人記帳與預算、
      個人資料整理（照片、文件、筆記）、無障礙與長輩使用。必須同時有：具體的人、具體做法，
      以及可觀察的成效或讀者可照做的步驟。
      不要收：任何工作／職場／團隊／寫程式相關內容；AI 廠商的客戶案例或成功故事；
      「N 個 AI 工具」清單與工具比較；新功能宣告或初體驗；課程、招生、聯盟行銷與購物優惠文；
      投資、股票、加密貨幣；醫療診斷或取代醫師的建議（只收「用 AI 整理健康資料、準備問醫師的問題」這類）；
      沒有具體案例的觀點文或趨勢分析；用 AI 學習或降低認知負荷（屬於 📚 用 AI 學習）。
    min_items: 1   # sources are sparse — show even a single good fit
    filter:
      keywords: ["daily life", "everyday", "family", "parent", "kids", "travel", "meal", "budget", "language learning", "seniors", "生活", "親子", "旅遊", "記帳", "長輩"]
      exclude: [" with OpenAI", " with ChatGPT Work", " with GPT-"]   # vendor customer stories

  - id: ai-monetization
    display_name: "💰 用 AI 賺錢"
    prompt: >-
      用 AI 賺錢的實例與方法，聚焦三類：
      (1) Agent as a Service（AaaS）：把 AI agent 當成服務或產品賣（代客建置與維運 agent、agent 訂閱、
      按成果計價），談商業模式、定價、交付方式、客戶與實際案例；
      (2) 個人靠 AI 賺錢的經驗：個人、自由工作者或 solo founder 用 AI 接案、做產品、做內容或提供服務，
      有具體做法與收入／成效（定價、案件或客戶數、MRR、花費與時間投入）；
      (3) 小團隊（約 20 人以下）AI 產品的營收拆解與 AI 原生商業模式（定價、推論成本吃掉毛利）。
      必須有具名的人或產品、具體做法，以及具體數字或可觀察的成效；AI 必須是賺錢方式的核心。
      受訪者自述的收入可以收，但摘要中要能辨識是自述；能附公開營收頁（TrustMRR、Open Startup）更好。
      不要收：致富課程、教練、付費社群或 bootcamp 推銷（包括以賣課為主的「AI 代理商」教學）；
      「月入百萬／被動收入／躺賺」標題黨；聯盟行銷導購與工具清單；MLM；沒有具名產品或人、無法查證的收入宣稱；
      加密貨幣、代幣、交易機器人、投資理財；只有點子沒有實際收入的「N 個 AI 創業點子」；募資新聞；
      大公司財報或大公司 agent 產品發表；企業內部導入 AI 降本的案例（屬於 🏢 企業導入）；
      agent 框架或技術教學（屬於 🎓 AI 使用技巧）；和 AI 無關的一般 SaaS 經營文。
    min_items: 3
    filter:
      keywords: ["agent as a service", "AaaS", "AI agency", "freelance", "side income", "solo founder", "indie hacker", "MRR", "ARR", "pricing", "paying customers", "outcome-based", "副業", "接案", "營收", "定價"]
  - id: release-tracker
    display_name: "🛠 工具最新 release"
    prompt: "追蹤的開發工具最新版本與變更內容。"
    selection_mode: chronological
    lookback_days: 7
    max_items: 12
    filter:
      sources:
        - claude-code-releases
        - codex-releases
        - gitnexus-releases
        - hermes-agent-releases
        - ecc-releases
        - ruflo-releases
        - claude-mem-releases
        - superpowers-releases
